<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1F3864; --text:#18212F; --muted:#5A6577;
  --grid:#D8E0EA; --accent:#C55A11; --accent-soft:#FBEDE3; --ok:#3F7A3A; --ok-soft:#E6F1E3;
  --focus:#C55A11; --bar:#1F3864; --barText:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101826; --surface:#172234; --ink:#AFC4EA; --text:#E4EAF3; --muted:#9AA7BC;
    --grid:#2A3850; --accent:#F08A4B; --accent-soft:#3A2618; --ok:#8CC784; --ok-soft:#1F3320;
    --focus:#F08A4B; --bar:#0B1220; --barText:#E4EAF3;
  }
}
:root[data-theme="dark"]{
  --bg:#101826; --surface:#172234; --ink:#AFC4EA; --text:#E4EAF3; --muted:#9AA7BC;
  --grid:#2A3850; --accent:#F08A4B; --accent-soft:#3A2618; --ok:#8CC784; --ok-soft:#1F3320;
  --focus:#F08A4B; --bar:#0B1220; --barText:#E4EAF3;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.bar{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barText);
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;min-height:56px}
.bar h1{flex:1;min-width:0;font-size:1.55rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.8rem;font-weight:400;opacity:.8}
.iconbtn{flex:none;background:none;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;margin:12px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--grid);min-height:58px;width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
button.row:active{background:var(--bg)}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:700}
.row .m{display:block;font-size:.85rem;color:var(--muted)}
.fold{flex:none;font-size:1.5rem;line-height:1}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg)}
.count{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--grid);border-radius:20px;padding:2px 10px}
.count.full{color:var(--ok);border-color:currentColor;background:var(--ok-soft)}
.niveau{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-weight:700}
.niveau select{flex:1;font:inherit;font-weight:600;padding:10px 12px;border:1px solid var(--grid);border-radius:12px;background:var(--surface);color:var(--ink)}
.niv-titre{font-weight:700;font-size:1.05rem;margin:18px 0 0}
details.annee{margin:14px 0}
details.annee>summary{cursor:pointer;list-style:none;font-weight:700;font-size:1.05rem;padding:12px 16px;background:var(--surface);border:1px solid var(--grid);border-radius:12px;display:flex;align-items:center;gap:8px}
details.annee>summary::-webkit-details-marker{display:none}
details.annee>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.annee[open]>summary::before{transform:rotate(90deg)}
details.annee[open]>summary{margin-bottom:4px}
.grille{overflow-x:auto;padding:0}
.grille table{border-collapse:collapse;width:100%;font-size:.9rem}
.grille th,.grille td{padding:10px 4px;text-align:center;border-top:1px solid var(--grid);white-space:nowrap}
.grille tr:first-child th{border-top:0}
.grille .nom{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--surface);max-width:130px;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.grille th.col{font-size:.8rem;color:var(--muted);cursor:pointer;min-width:44px}
.grille td.c{cursor:pointer;font-size:1.05rem;min-width:44px}
.grille td.c.busy{opacity:.35}
.grille th.lk,.grille td.lk{background:var(--accent-soft)}
.grille th.lk{color:var(--accent)}
.grille .sep{border-right:2px solid var(--grid)}
.grille tr.tot td{font-size:.75rem;color:var(--muted);font-weight:700}
.grille th.tcol{white-space:normal;min-width:96px;max-width:130px;line-height:1.2}
.grille small.tsc{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:middle}
.cpg td{font-size:.78rem;white-space:normal;line-height:1.35;min-width:52px}
.cp{display:inline-block;border-radius:9px;padding:0 6px;margin:1px;font-weight:700;font-size:.75rem}
.cp.n1{background:#EFE7FA;color:#7A4FB5}.cp.n2{background:#D9C6F3;color:#4B2A80}.cp.n3{background:#7A4FB5;color:#fff}
.cp.vu{background:none;color:var(--muted);font-weight:400}
.dot.non{background:#B4B2A9}.dot.cours{background:#EF9F27}.dot.fini{background:#639922}
.sec{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 0}
.tabs{display:flex;gap:6px;margin:14px 0 4px;background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:7px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
/* Interrupteur */
.sw{flex:none;position:relative;width:52px;height:32px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--grid);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked + span{background:var(--ok)}
.sw input:checked + span::after{transform:translateX(20px)}
.sw input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.sw input:disabled + span{opacity:.5}
@media (prefers-reduced-motion: reduce){.sw span,.sw span::after{transition:none}}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface);margin:10px 0}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
input[type=text],input[type=password]{width:100%;font:inherit;padding:12px;border:1px solid var(--grid);border-radius:10px;background:var(--surface);color:var(--text);margin:6px 0}
label.f{display:block;font-size:.9rem;color:var(--muted);margin-top:10px}
.note{color:var(--muted);font-size:.92rem;margin:8px 4px}
.err{color:var(--accent);font-weight:700;min-height:1.3em;margin:6px 0}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:20px;padding:1px 8px;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.no{color:var(--accent)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:10px;font-size:.95rem;display:none;max-width:calc(100% - 32px);z-index:9}
.empty{color:var(--muted);text-align:center;padding:24px 16px}
.progress{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--ok);width:0}
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  .bar,#app,.toast{display:none!important}
  #print{display:block;font:11pt Arial,sans-serif;color:#000}
  .fiche{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .carte{border:1px dashed #888;padding:12px 14px;height:46mm;break-inside:avoid}
  .carte b{font-size:13pt}
  .carte .l{margin-top:6px}
  .carte .u{font-size:9pt;margin-top:8px;color:#333}
}
[hidden]{display:none!important}
/* Tests d'entrée */
.notif{background:#FFF7E0;border:1px solid #E8C35A;border-radius:12px;padding:12px 14px;margin:14px 0}
.notif h2{font-size:1.05rem;margin:0 0 6px}
.notif .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #EBD9A3}
.notif .it:first-of-type{border-top:0}
.notif .it span{flex:1}
.notif .it small{display:block;color:var(--muted)}
.mini{font:inherit;font-size:.85rem;font-weight:700;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.st-ok{color:#1f7a3f;font-weight:700}.st-cours{color:#b45309;font-weight:700}.st-non{color:var(--muted)}
.qrow{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--grid)}
.qrow:first-child{border-top:0}
.qrow .r{flex:none;width:22px;font-weight:700}
.qrow .r.ok{color:#1f7a3f}.qrow .r.ko{color:#b4372b}
.qrow span.x{flex:1}
.qrow small{display:block;color:var(--muted)}
/* Cadenas dessinés (24/11/2026) : fermé rouge, anse baissée ; ouvert vert, anse levée et pivotée */
.lk{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em}
</style>

<body>
<div class="bar">
  <button class="iconbtn" id="back" aria-label="Retour" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title">Corrigés<span class="sub" id="subtitle"></span></h1>
  <button class="iconbtn" id="menu" aria-label="Réglages" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</div>
<main class="wrap" id="app"><p class="empty">Chargement…</p></main>
<div id="print"></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, collection, query, where, onSnapshot, serverTimestamp, writeBatch, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB = {"apiKey":"AIzaSyDH32Ma0shVbsIHR0xNJbahb5MO0RKHRS0","authDomain":"physique-neruda.firebaseapp.com","projectId":"physique-neruda","storageBucket":"physique-neruda.firebasestorage.app","messagingSenderId":"62730174289","appId":"1:62730174289:web:588c846aadd4eec2109d70"};
const DOMAINE = "@physique-neruda.firebaseapp.com";
const PROF = "prof" + DOMAINE;
const app = initializeApp(FB), auth = getAuth(app), db = getFirestore(app);
const BASE = /\/essai\/[^/]*$/.test(location.pathname) ? "../" : "";
const SITE_URL = location.origin + location.pathname.replace(/[^/]*$/, "");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const enc = new TextEncoder();
function toast(m){ const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500); }

let CAT = null, CLASSES = [], MAITRE = null, unsub = null, EVAL = { evaluations: [] };
let REV = { tests: [], fiches: {} }, SITES = {}, KOUT = null;   // tests d'entrée (revisions.json) et clés des BTS
let stack = [];   // pile d'écrans pour le bouton retour

function setBar(title, sub, canBack){
  $("#title").innerHTML = esc(title) + (sub ? `<span class="sub">${esc(sub)}</span>` : "");
  $("#back").hidden = !canBack; $("#menu").hidden = !auth.currentUser;
}
function stopLive(){ if (unsub) { unsub(); unsub = null; } }
function go(fn, ...args){ stack.push([fn, args]); stopLive(); fn(...args); window.scrollTo(0, 0); }
$("#back").onclick = () => { stack.pop(); const [fn, args] = stack[stack.length - 1] || [home, []]; stopLive(); fn(...args); };
$("#menu").onclick = () => go(settings);

/* ---------- Connexion ---------- */
function loginScreen(){
  stack = []; setBar("Corrigés", "Espace professeur", false);
  $("#app").innerHTML = `<div class="card" style="padding:16px">
    <h2 style="font-size:1.5rem">Connexion professeur</h2>
    <label class="f" for="pw">Mot de passe professeur</label>
    <input type="password" id="pw" autocomplete="current-password">
    <p class="err" id="err"></p>
    <button class="btn" id="go">Se connecter</button>
    <button class="btn ghost" id="first">Première utilisation : créer le compte professeur</button>
  </div>
  <p class="note">Sur iPhone : touchez le bouton Partager de Safari, puis « Sur l'écran d'accueil » pour installer l'appli.</p>`;
  const err = $("#err");
  $("#go").onclick = async () => {
    err.textContent = "";
    try { await setPersistence(auth, browserLocalPersistence); await signInWithEmailAndPassword(auth, PROF, $("#pw").value); }
    catch(e){ err.textContent = e.code === "auth/too-many-requests" ? "Trop d'essais, patientez." : "Mot de passe incorrect."; }
  };
  $("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
  $("#first").onclick = () => {
    $("#app").innerHTML = `<div class="card" style="padding:16px">
      <h2 style="font-size:1.5rem">Créer le compte professeur</h2>
      <p class="note">Choisissez un mot de passe d'au moins 10 caractères. Il protège l'accès à tous les corrigés et aux comptes des élèves.</p>
      <label class="f" for="p1">Mot de passe</label><input type="password" id="p1" autocomplete="new-password">
      <label class="f" for="p2">Confirmer</label><input type="password" id="p2" autocomplete="new-password">
      <p class="err" id="err"></p>
      <button class="btn" id="create">Créer le compte</button>
      <button class="btn ghost" id="cancel">Annuler</button></div>`;
    $("#cancel").onclick = loginScreen;
    $("#create").onclick = async () => {
      const e2 = $("#err"), a = $("#p1").value, b = $("#p2").value;
      if (a.length < 10) { e2.textContent = "10 caractères minimum."; return; }
      if (a !== b) { e2.textContent = "Les deux mots de passe sont différents."; return; }
      try { await setPersistence(auth, browserLocalPersistence); await createUserWithEmailAndPassword(auth, PROF, a); toast("Compte professeur créé."); }
      catch(x){ e2.textContent = x.code === "auth/email-already-in-use" ? "Le compte professeur existe déjà : connectez-vous." : "Création impossible (" + (x.code || "erreur") + ")."; }
    };
  };
}

/* ---------- Données ---------- */
async function loadAll(){
  CAT = await fetch(BASE + "catalogue-v2.json", {cache:"no-cache"}).then(r => r.json());
  REV = await fetch(BASE + "revisions.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : REV).catch(() => REV);
  EVAL = await fetch(BASE + "evaluations.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : { evaluations: [] }).catch(() => ({ evaluations: [] }));
  const snap = await getDocs(collection(db, "classes"));
  CLASSES = []; snap.forEach(d => CLASSES.push({ id:d.id, ...d.data() }));
  CLASSES.sort((a, b) => (a.ordre ?? 99) - (b.ordre ?? 99));
  const p = await getDoc(doc(db, "prive", "cles"));
  SITES = p.exists() ? (p.data().sites || {}) : {};
  if (p.exists()) { const o = p.data().ouvertures || {}; OUVERT_ENR = JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]])); }
  getDocs(collection(db, "deblocages")).then(syncOuvertures).catch(() => {});
  MAITRE = p.exists() && p.data().corriges ? await crypto.subtle.importKey("raw", b64(p.data().corriges), "AES-GCM", false, ["decrypt"]) : null;
}
/* Élèves inscrits dans deux classes (ex. 2ET / 2ETA) : leur compte (uid) n'est enregistré que dans une classe ;
   on le retrouve par l'identifiant pour qu'ils reçoivent aussi les corrigés et évaluations de l'autre classe. */
/* Résumé des chapitres ouverts (24/11/2026) : date du 1er déblocage de chaque chapitre pour un vrai élève,
   enregistrée dans prive/cles pour que le compte « professeur » du site range aussi les dossiers. */
let OUVERT_ENR = null;
async function syncOuvertures(snap){
  const ids = new Set(); (CAT.classes || []).forEach(k => k.chapitres.forEach(ch => ch.verrou && ids.add(ch.verrou.id)));
  const o = {};
  snap.forEach(x => { const v = x.data(); if (!ids.has(v.doc) || v.classe === "invites" || !(v.at && v.at.toMillis)) return;
    const t = v.at.toMillis(); if (!o[v.doc] || t < o[v.doc]) o[v.doc] = t; });
  const js = JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
  if (js === OUVERT_ENR) return; OUVERT_ENR = js;
  try { await updateDoc(doc(db, "prive", "cles"), { ouvertures: o }); } catch(_){}
}
function elevesDe(c){
  const uidDe = {}; CLASSES.forEach(k => (k.eleves || []).forEach(e => { if (e.uid) uidDe[e.login] = e.uid; }));
  return (c.eleves || []).map(e => e.uid ? e : (uidDe[e.login] ? { ...e, uid: uidDe[e.login] } : e)).filter(e => e.uid);
}
function corriges(site){
  const c = CAT.classes.find(x => x.id === site); if (!c) return [];
  // Un chapitre verrouillé apparaît en tête de sa liste, comme un corrigé : « Ouvrir le chapitre » = transmettre sa clé
  // Test d'entrée sous son propre cadenas (19/11/2026) : à ouvrir avant le chapitre
  const testDe = ch => ch.verrou && (REV.tests || []).find(t => t.site === site && t.verrou && t.verrou.chap === ch.verrou.id);
  return c.chapitres.map(ch => { const t = testDe(ch);
    return { ch, docs: (t ? [{ titre: "🔒 Accès au test d'entrée", chapitre: true, test: true, corrige: t.verrou }] : [])
      .concat(ch.verrou ? [{ titre: "🔒 Accès au chapitre (dossier verrouillé)", chapitre: true, corrige: ch.verrou }] : []).concat(ch.docs.filter(d => d.corrige && d.type !== "Point de cours").map(d => { const p = ch.docs.find(p => p.type === "Point de cours" && p.corrige.id === d.corrige.id); return p ? { ...d, avecPdc: true, pdc: p.pdc } : d; })) }; }).filter(x => x.docs.length);
}
async function unwrap(d){
  const w = b64(d.corrige.wk);
  const raw = await crypto.subtle.decrypt({name:"AES-GCM", iv:w.slice(0,12), additionalData:enc.encode(d.corrige.id)}, MAITRE, w.slice(12));
  return tob64(raw);
}

/* ---------- Accueil : les classes ---------- */
function home(){
  stack = [[home, []]]; setBar("Corrigés", "Mes classes", false);
  if (!CLASSES.length) {
    $("#app").innerHTML = `<div class="card" style="padding:16px"><h2 style="font-size:1.4rem">Bienvenue</h2>
      <p>Pour commencer, importez le fichier « Fichier pour l'appli professeur.json » (dossier « Site - contenu » de votre Mac). C'est à faire une seule fois, depuis le Mac.</p>
      <button class="btn" id="imp">Importer le fichier</button></div>`;
    $("#imp").onclick = () => go(settings); return;
  }
  const html = CLASSES.map(c => {
    const n = (c.eleves || []).length, nc = corriges(c.site).reduce((a, x) => a + x.docs.filter(d => !d.chapitre).length, 0);
    return `<button class="row" data-id="${esc(c.id)}"><span class="main"><span class="t">${esc(c.nom)}</span><span class="m">${n} élève${n>1?"s":""} · ${nc} corrigé${nc>1?"s":""}</span></span><span class="chev"></span></button>`;
  }).join("");
  $("#app").innerHTML = `<div id="notif"></div><div class="card">${html}</div>`;
  $("#app").querySelectorAll(".card .row").forEach(b => b.onclick = () => go(classe, b.dataset.id, "corriges"));
  if ((REV.tests || []).length) suivreTests(etat => afficherNotif(etat));
}

/* ---------- Une classe ---------- */
function classe(id, tab){
  const c = CLASSES.find(x => x.id === id); if (!c) return home();
  setBar(c.nom, tab === "corriges" ? "Corrigés à débloquer" : tab === "evaluations" ? "Évaluations corrigées" : tab === "tests" ? "Tests d'entrée" : tab === "pdc" ? "Points de cours" : "Élèves et comptes", true);
  const tabs = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==="corriges"}" data-t="corriges">Corrigés</button><button role="tab" aria-selected="${tab==="evaluations"}" data-t="evaluations">Évaluations</button>${testsClasse(c).length ? `<button role="tab" aria-selected="${tab==="tests"}" data-t="tests">Tests</button>` : ""}<button role="tab" aria-selected="${tab==="eleves"}" data-t="eleves">Élèves</button></div>`;
  $("#app").innerHTML = tabs + `<div id="pane"></div>`;
  $("#app").querySelectorAll(".tabs button").forEach(b => b.onclick = () => { stack[stack.length-1] = [classe, [id, b.dataset.t]]; stopLive(); classe(id, b.dataset.t); });
  if (tab === "corriges") paneCorriges(c); else if (tab === "evaluations") paneEvals(c); else if (tab === "tests") paneTests(c); else if (tab === "pdc") panePdc(c); else paneEleves(c);
}

/* Rubrique d'un corrigé (Activités, TP, Exercices) : celle du catalogue, sinon devinée d'après le titre */
const RUB_ORDRE = ["Activités et TP", "Activités", "TP", "Exercices", "Autres"];
function rubriqueDe(d){
  if (d.rubrique) return d.rubrique;
  const t = (d.titre || "").toLowerCase();
  if (/exercice/.test(t)) return "Exercices";
  if (/\btp\s*\d|\btp\b/.test(t)) return "TP";
  if (/activit/.test(t)) return "Activités";
  return "Autres";
}
const plur = (n, s) => n + " " + s + (n > 1 ? "s" : "");
function libDoc(d, n, total){
  if (d.test) return n === total && total ? "Test ouvert à toute la classe" : n ? "Test ouvert pour " + plur(n, "élève") : "Test fermé aux élèves";
  if (d.chapitre) return n === total && total ? "Chapitre ouvert à toute la classe" : n ? "Ouvert pour " + plur(n, "élève") : "Chapitre fermé aux élèves";
  return (n === total && total ? "Débloqué pour toute la classe" : n ? plur(n, "élève") + " débloqué" + (n > 1 ? "s" : "") : "Personne pour l'instant") + (d.avecPdc ? " · avec le point de cours" : "");
}
/* Comptage en direct des déblocages des élèves de la classe */
function suivreDeblocages(c, cb){
  const mesUid = new Set(elevesDe(c).map(e => e.uid));
  unsub = onSnapshot(collection(db, "deblocages"), snap => {
    syncOuvertures(snap);
    const counts = {}, prem = {}; snap.forEach(x => { const v = x.data(); if (mesUid.has(v.uid)) { counts[v.doc] = (counts[v.doc] || 0) + 1;
      const t = v.at && v.at.toMillis ? v.at.toMillis() : Date.now(); if (!prem[v.doc] || t < prem[v.doc]) prem[v.doc] = t; } }); cb(counts, prem);
  }, e => toast("Lecture impossible : " + e.code));
}

/* Onglet Corrigés : un dossier par chapitre, comme sur le site */
function paneCorriges(c){
  const groups = corriges(c.site), total = elevesDe(c).length;
  const ma = /(\d)\s*(?:re|ère|e|ème)\s+ann[ée]e/i.exec(c.nom || ""), monAn = ma ? +ma[1] : null;
  if (!groups.length) { $("#pane").innerHTML = `<p class="empty">Aucun corrigé élève pour ce BTS pour l'instant.</p>`; return; }
  let choix = paneCorriges.niv[c.id] ?? null, last = {};
  const dossier = g => {
    const docs = g.docs.filter(d => !d.chapitre), lock = g.docs.find(d => d.chapitre && !d.test), tlock = g.docs.find(d => d.test);
    const full = docs.filter(d => total && (last[d.corrige.id] || 0) === total).length;
    const part = docs.filter(d => (last[d.corrige.id] || 0) > 0 && (last[d.corrige.id] || 0) < total).length;
    let etat = "";
    if (tlock) { const n = last[tlock.corrige.id] || 0; etat = n === total && total ? "Test 🔓 · " : n ? "Test 🔓 " + n + " · " : "Test 🔒 · "; }
    if (lock) { const n = last[lock.corrige.id] || 0; etat += n === total && total ? "🔓 Ouvert · " : n ? "🔓 Ouvert pour " + n + " · " : "🔒 Fermé · "; }
    const m = etat + plur(docs.length, "corrigé") + (part ? " · " + part + " en cours" : "");
    return `<button class="row" data-ch="${esc(g.ch.titre)}"><span class="fold" aria-hidden="true">📁</span><span class="main"><span class="t">${esc(g.ch.titre)}</span><span class="m">${m}</span></span>`
      + (docs.length ? `<span class="count${full === docs.length && full ? " full" : ""}" title="Corrigés débloqués pour toute la classe">${full}/${docs.length}</span>` : "") + `<span class="chev"></span></button>`;
  };
  /* Ordre des dossiers (24/11/2026), comme sur le site : le plus récemment ouvert à la classe en haut,
     puis les plus anciens ; les chapitres encore fermés à toute la classe en bas. */
  const idx = new Map(groups.map((g, i) => [g, i]));
  const ordonner = (counts, prem) => {
    const lockDe = g => g.docs.find(d => d.chapitre && !d.test);
    const etat = g => { const l = lockDe(g); return !l ? 1 : (counts[l.corrige.id] || 0) > 0 ? 0 : 2; };
    const date = g => prem[lockDe(g).corrige.id] || 0;
    groups.sort((a, b) => { const ea = etat(a), eb = etat(b);
      if (ea !== eb) return ea - eb;
      if (ea === 0 && date(a) !== date(b)) return date(b) - date(a);
      if (ea === 2) return idx.get(a) - idx.get(b);
      const na = parseFloat(a.ch.num), nb = parseFloat(b.ch.num);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
      return idx.get(b) - idx.get(a); });
  };
  const render = (counts, prem = {}) => {
    last = counts; ordonner(counts, prem);
    const annees = [...new Set(groups.map(g => g.ch.annee).filter(Boolean))].sort();
    const nomAn = a => a === 1 ? "1re année" : a + "e année";
    let html;
    if (!annees.length) html = `<div class="card">${groups.map(dossier).join("")}</div>`;
    else {
      if (choix === null) choix = annees.includes(monAn) ? monAn : annees[0];
      const opts = annees.map(a => `<option value="${a}"${choix === a ? " selected" : ""}>${nomAn(a)}${a === monAn ? " (ma classe)" : ""}</option>`).join("")
        + `<option value="0"${choix === 0 ? " selected" : ""}>Tous les niveaux</option>`;
      const vus = choix === 0 ? annees : [choix];
      html = `<label class="niveau">Niveau <select id="niv">${opts}</select></label>`
        + vus.map(a => { const gs = groups.filter(g => g.ch.annee === a); return gs.length ? (choix === 0 ? `<p class="niv-titre">${nomAn(a)}</p>` : "") + `<div class="card">${gs.map(dossier).join("")}</div>` : ""; }).join("");
      const sans = groups.filter(g => !g.ch.annee); if (sans.length) html += `<div class="card">${sans.map(dossier).join("")}</div>`;
    }
    $("#pane").innerHTML = html + `<p class="note">Touchez un chapitre pour voir ses corrigés. Le nombre à droite indique les corrigés débloqués pour toute la classe.</p>`
      + (total ? "" : `<p class="note">Aucun compte élève n'est encore créé : onglet « Élèves et comptes ».</p>`);
    const niv = $("#niv"); if (niv) niv.onchange = () => { choix = +niv.value; paneCorriges.niv[c.id] = choix; render(last, lastPrem); };
    $("#pane").querySelectorAll(".row").forEach(b => b.onclick = () => go(chapitreCorriges, c.id, b.dataset.ch));
  };
  let lastPrem = {};
  render({});
  suivreDeblocages(c, (counts, prem) => { lastPrem = prem; render(counts, prem); });
}
paneCorriges.niv = {};   // niveau choisi, gardé au retour

/* Un chapitre ouvert : accès au chapitre puis corrigés rangés par Activités / TP / Exercices */
function chapitreCorriges(cid, titre){
  const c = CLASSES.find(x => x.id === cid); if (!c) return home();
  const g = corriges(c.site).find(x => x.ch.titre === titre); if (!g) return classe(cid, "corriges");
  setBar(titre, c.nom, true);
  return chapitreGrille(c, g);   // tous les dossiers en tableau (24/11/2026)
  const total = elevesDe(c).length;
  const ligne = (d, counts) => { const n = counts[d.corrige.id] || 0;
    return `<button class="row" data-doc="${esc(d.corrige.id)}"><span class="main"><span class="t">${esc(d.titre)}</span><span class="m">${libDoc(d, n, total)}</span></span><span class="count${n === total && total ? " full" : ""}">${n}/${total}</span><span class="chev"></span></button>`; };
  const render = counts => {
    const locks = g.docs.filter(d => d.chapitre), docs = g.docs.filter(d => !d.chapitre);
    const rubs = RUB_ORDRE.concat([...new Set(docs.map(rubriqueDe))].filter(r => !RUB_ORDRE.includes(r)));
    let html = locks.length ? `<p class="sec">Accès au chapitre</p><div class="card">${locks.map(d => ligne(d, counts)).join("")}</div>` : "";
    rubs.forEach(r => { const ds = docs.filter(d => rubriqueDe(d) === r); if (ds.length) html += `<p class="sec">${esc(r)}</p><div class="card">${ds.map(d => ligne(d, counts)).join("")}</div>`; });
    $("#app").innerHTML = html || `<p class="empty">Aucun corrigé dans ce chapitre.</p>`;
    $("#app").querySelectorAll(".row").forEach(b => b.onclick = () => go(docEleves, c.id, g.docs.find(x => x.corrige.id === b.dataset.doc)));
  };
  render({});
  suivreDeblocages(c, render);
}

/* ---------- Chapitre en tableau (22/11/2026) : élèves en lignes, corrigés en colonnes ----------
   Une case = débloquer / reverrouiller le corrigé de cet élève (et son point de cours).
   Pastille : gris pas commencé, orange en cours, vert terminé. Titre de colonne = toute la classe. */
const courtDe = d => { const t = d.titre || ""; let m, b;
  if ((m = /activit[ée]\s*(\d+)/i.exec(t))) b = "A" + m[1];
  else if ((m = /\btp\s*(\d+)/i.exec(t))) b = "TP" + m[1];
  else if ((m = /exercice\s*(\d+)/i.exec(t))) b = "Ex" + m[1];
  else if (/annale/i.test(t)) return "Annale";
  else return t.replace(/^corrig[ée]\s*/i, "").slice(0, 6);
  if (/r[ée]sultat/i.test(t)) return b + " rés.";
  if (/pr[ée]paration/i.test(t)) return b + " prép.";
  if (/compte\s*rendu/i.test(t)) return b + " CR";
  return b; };
/* Ordre des colonnes : activités et TP dans l'ordre du dossier, puis exercices (annale en dernier) ; pour un même TP : préparation, compte rendu, résultats */
const rangDe = d => { const b = baseDe(d); return /^Ex/.test(b) ? 1 : b === "Annale" ? 2 : 0; };
const baseDe = d => courtDe(d).split(" ")[0];
const subDe = d => /pr[ée]paration/i.test(d.titre) ? 0 : /r[ée]sultat/i.test(d.titre) ? 2 : 1;
const ordonner = ds => { const first = {}; ds.forEach((d, i) => { const b = baseDe(d); if (!(b in first)) first[b] = i; });
  return ds.map((d, i) => [d, i]).sort((a, b) => rangDe(a[0]) - rangDe(b[0]) || first[baseDe(a[0])] - first[baseDe(b[0])] || subDe(a[0]) - subDe(b[0]) || a[1] - b[1]).map(x => x[0]); };
function chapitreGrille(c, g){
  setBar(g.ch.titre, c.nom, true);
  const el = elevesDe(c), mesUid = new Set(el.map(e => e.uid));
  /* Cadenas du test d'entrée et du dossier en premières colonnes (24/11/2026) */
  const locks = g.docs.filter(d => d.chapitre), docs = ordonner(g.docs.filter(d => !d.chapitre)), cols = locks.concat(docs);
  if (!el.length) { $("#app").innerHTML = `<p class="empty">Créez d'abord les comptes des élèves (onglet « Élèves et comptes »).</p>`; return; }
  let D = new Set(), P = {}, counts = {}, busy = new Set();
  const cles = {};
  const key = async d => { if (!cles[d.corrige.id]) { if (!MAITRE) throw new Error("cles"); cles[d.corrige.id] = await unwrap(d); } return cles[d.corrige.id]; };
  const ref = (d, uid) => doc(db, "deblocages", d.corrige.id + "_" + uid);
  /* Coups de pouce en cascade (24/11/2026) : niveaux atteints par question, Firestore « pointsdecours » (pdc = "pouce:<corrigé>") */
  const pouceDe = (d, uid) => { const v = P[uid + "__pouce:" + d.corrige.id]; if (!v) return "–";
    const q = Object.entries(v.niveaux || {}).filter(([, n]) => n > 1);
    return q.length ? q.map(([k, n]) => `<span class="cp n${n}">${esc(k)} ${n}</span>`).join("") : `<span class="cp vu">lu</span>`; };
  /* Tableau des coups de pouce affiché dès que le dossier a des fiches en cascade, même si personne ne les a encore ouvertes (24/11/2026) */
  const pouceIds = new Set((g.ch.docs || []).filter(x => x.pouce).map(x => x.pouce));
  const aPouceBase = docs.some(d => d.corrige && pouceIds.has("pouce:" + d.corrige.id));
  let aPouce = aPouceBase;
  const caseDe = (d, uid) => {
    if (!D.has(d.corrige.id + "_" + uid)) return "🔒";
    if (d.chapitre) return `<span title="${d.test ? "Test ouvert" : "Dossier ouvert"}">🔓</span>`;
    if (!d.avecPdc) return `<span style="color:var(--ok);font-weight:700">✓</span>`;
    const v = P[uid + "__" + d.pdc];
    return v && v.termine ? `<span class="dot fini" title="Point de cours terminé"></span>` : v ? `<span class="dot cours" title="Point de cours en cours"></span>` : `<span class="dot non" title="Point de cours pas commencé"></span>`;
  };
  const render = () => {
    const sep = j => j === locks.length - 1 && docs.length ? " sep" : "";
    let html = `<div class="card grille"><table><tr><th class="nom">Élève</th>${cols.map((d, j) => `<th class="col${d.chapitre ? " lk" : ""}${sep(j)}" data-j="${j}" title="${esc(d.titre)}">${d.chapitre ? (d.test ? "Test" : "Dossier") : esc(courtDe(d))}</th>`).join("")}</tr>`
      + el.map(e => `<tr><td class="nom">${esc(e.nom)}</td>${cols.map((d, j) => `<td class="c${d.chapitre ? " lk" : ""}${sep(j)}${busy.has(d.corrige.id + "_" + e.uid) ? " busy" : ""}" data-j="${j}" data-uid="${esc(e.uid)}">${caseDe(d, e.uid)}</td>`).join("")}</tr>`).join("")
      + `<tr class="tot"><td class="nom">Ouverts</td>${cols.map((d, j) => `<td class="${sep(j)}">${counts[d.corrige.id] || 0}/${el.length}</td>`).join("")}</tr></table></div>`
      + `<p class="note">Touche une case pour ouvrir à l'élève ; touche-la à nouveau pour refermer (une confirmation est demandée pour refermer le dossier ou le test). Touche le titre d'une colonne pour toute la classe.${locks.length ? " Les premières colonnes sont les cadenas du " + (locks.some(d => d.test) ? "test d'entrée et du " : "") + "dossier." : ""}<br>🔓 dossier ou test ouvert · 🔒 verrouillé · <span class="dot non"></span> point de cours pas commencé · <span class="dot cours"></span> en cours · <span class="dot fini"></span> terminé · ✓ corrigé ouvert (sans point de cours)</p>`
      + (aPouce ? `<p class="sec">Coups de pouce utilisés</p><div class="card grille cpg"><table><tr><th class="nom">Élève</th>${docs.map(d => `<th title="${esc(d.titre)}">${esc(courtDe(d))}</th>`).join("")}</tr>`
        + el.map(e => `<tr><td class="nom">${esc(e.nom)}</td>${docs.map(d => `<td>${pouceDe(d, e.uid)}</td>`).join("")}</tr>`).join("")
        + `</table></div><p class="note">Pour chaque élève, les questions où il a débloqué un coup de pouce supplémentaire : <span class="cp n2">B5 2</span> niveau 2 · <span class="cp n3">B5 3</span> niveau 3. <span class="cp vu">lu</span> fiche ouverte, niveau 1 seulement · – fiche jamais ouverte.</p>` : "");
    const sx = $(".grille") ? $(".grille").scrollLeft : 0;
    $("#app").innerHTML = html; if ($(".grille")) $(".grille").scrollLeft = sx;
    $("#app").querySelectorAll("td.c").forEach(td => td.onclick = async () => {
      const d = cols[+td.dataset.j], uid = td.dataset.uid, id = d.corrige.id + "_" + uid; if (busy.has(id)) return;
      const val = !D.has(id);
      if (!val && d.chapitre && !confirm((d.test ? "Refermer le test d'entrée pour " : "Refermer le dossier pour ") + (el.find(e => e.uid === uid) || {}).nom + " ?")) return; busy.add(id); render();
      try { if (val) await setDoc(ref(d, uid), { uid, doc:d.corrige.id, classe:c.id, cle: await key(d), at: serverTimestamp() }); else await deleteDoc(ref(d, uid)); }
      catch(e){ toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
      busy.delete(id); render();
    });
    $("#app").querySelectorAll("th.col").forEach(th => th.onclick = async () => {
      const d = cols[+th.dataset.j], tous = el.every(e => D.has(d.corrige.id + "_" + e.uid));
      const quoi = d.chapitre ? (d.test ? "le test d'entrée" : "le dossier « " + g.ch.titre + " »") : "« " + d.titre + " »";
      if (!confirm((tous ? (d.chapitre ? "Refermer " : "Reverrouiller ") : (d.chapitre ? "Ouvrir " : "Débloquer ")) + quoi + " pour toute la classe ?")) return;
      try { const k = tous ? null : await key(d), batch = writeBatch(db);
        el.forEach(e => { if (tous) batch.delete(ref(d, e.uid)); else batch.set(ref(d, e.uid), { uid:e.uid, doc:d.corrige.id, classe:c.id, cle:k, at:serverTimestamp() }); });
        await batch.commit(); toast(d.chapitre ? (tous ? "Refermé pour toute la classe." : "Ouvert à toute la classe.") : tous ? "Corrigé reverrouillé pour toute la classe." : "Corrigé débloqué pour toute la classe."); }
      catch(e){ toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
    });
  };
  render();
  const a = onSnapshot(collection(db, "deblocages"), snap => {
    D = new Set(); counts = {};
    snap.forEach(x => { const v = x.data(); if (mesUid.has(v.uid)) { D.add(v.doc + "_" + v.uid); counts[v.doc] = (counts[v.doc] || 0) + 1; } }); render();
  }, e => toast("Lecture impossible : " + e.code));
  const b = onSnapshot(collection(db, "pointsdecours"), snap => {
    P = {}; aPouce = aPouceBase;
    snap.forEach(x => { const v = x.data(); if (mesUid.has(v.uid)) { P[v.uid + "__" + v.pdc] = v; if (v.type === "pouce" && docs.some(d => "pouce:" + d.corrige.id === v.pdc)) aPouce = true; } }); render();
  }, () => {});
  unsub = () => { a(); b(); };
}

/* ---------- Un corrigé : la liste des élèves à cocher ---------- */
function docEleves(cid, d){
  const c = CLASSES.find(x => x.id === cid);
  setBar(d.titre, c.nom, true);
  const el = elevesDe(c);
  if (!el.length) { $("#app").innerHTML = `<p class="empty">Créez d'abord les comptes des élèves (onglet « Élèves et comptes »).</p>`; return; }
  let on = new Set(), K = null, P = {}, CP = {};
  $("#app").innerHTML = `<div class="progress" aria-hidden="true"><i id="pb"></i></div><p class="note" id="pn"></p>
    <div class="card" id="list">${el.map(e => `<label class="row" style="cursor:pointer"><span class="main"><span class="t">${esc(e.nom)}</span><span class="m" data-m="${esc(e.uid)}">Verrouillé</span></span>
      <span class="sw"><input type="checkbox" data-uid="${esc(e.uid)}" aria-label="Débloquer pour ${esc(e.nom)}"><span></span></span></label>`).join("")}</div>
    <div class="btns"><button class="btn ok" id="all">Tout débloquer</button><button class="btn ghost" id="none">Tout verrouiller</button></div>`;
  const boxes = [...$("#list").querySelectorAll("input")];
  const paint = () => {
    const etatPdc = uid => { const v = P[uid]; return v && v.termine ? "🟢 Point de cours terminé" : v ? "🟠 Point de cours en cours" : "⚪ Point de cours pas commencé"; };
    const etatPouce = uid => { const v = CP[uid]; if (!v) return ""; const q = Object.entries(v.niveaux || {}).filter(([, n]) => n > 1);
      return " · Coups de pouce : " + (q.length ? q.map(([k, n]) => k + " niv. " + n).join(", ") : "niveau 1 seulement"); };
    boxes.forEach(b => { b.checked = on.has(b.dataset.uid); $(`[data-m="${b.dataset.uid}"]`).textContent = (b.checked ? (d.test ? "Test ouvert" : d.chapitre ? "Chapitre ouvert" : d.avecPdc ? etatPdc(b.dataset.uid) : "Corrigé débloqué") : "🔒 Verrouillé") + etatPouce(b.dataset.uid); });
    $("#pb").style.width = (100 * on.size / el.length) + "%";
    const nf = d.avecPdc ? el.filter(e => P[e.uid] && P[e.uid].termine).length : 0;
    $("#pn").textContent = `${on.size} / ${el.length} élèves ont accès ${d.test ? "au test d'entrée" : d.chapitre ? "au chapitre" : "au corrigé"}.` + (d.avecPdc ? ` Points de cours terminés : ${nf} / ${on.size}.` : "");
  };
  const key = async () => { if (!K) { if (!MAITRE) throw new Error("cles"); K = await unwrap(d); } return K; };
  const ref = uid => doc(db, "deblocages", d.corrige.id + "_" + uid);
  const set = async (uid, val) => {
    if (val) await setDoc(ref(uid), { uid, doc:d.corrige.id, classe:cid, cle: await key(), at: serverTimestamp() });
    else await deleteDoc(ref(uid));
  };
  boxes.forEach(b => b.onchange = async () => {
    const uid = b.dataset.uid, val = b.checked; b.disabled = true;
    try { await set(uid, val); if (val) on.add(uid); else on.delete(uid); }
    catch(e){ b.checked = !val; toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
    b.disabled = false; paint();
  });
  const bulk = async (val) => {
    try {
      const k = val ? await key() : null, batch = writeBatch(db);
      el.forEach(e => { if (val) batch.set(ref(e.uid), { uid:e.uid, doc:d.corrige.id, classe:cid, cle:k, at:serverTimestamp() }); else batch.delete(ref(e.uid)); });
      await batch.commit(); toast(d.test ? (val ? "Test d'entrée ouvert à toute la classe." : "Test d'entrée refermé pour toute la classe.") : d.chapitre ? (val ? "Chapitre ouvert à toute la classe." : "Chapitre refermé pour toute la classe.") : val ? "Corrigé débloqué pour toute la classe." : "Corrigé verrouillé pour toute la classe.");
    } catch(e){ toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
  };
  $("#all").onclick = () => bulk(true);
  if (d.chapitre) { $("#all").textContent = "Ouvrir le chapitre à toute la classe"; $("#none").textContent = "Refermer le chapitre"; }
  if (d.test) { $("#all").textContent = "Ouvrir le test à toute la classe"; $("#none").textContent = "Refermer le test"; }
  $("#none").onclick = () => { if (confirm(d.test ? "Refermer ce test d'entrée pour toute la classe ?" : d.chapitre ? "Refermer ce chapitre pour toute la classe ?" : "Verrouiller ce corrigé pour toute la classe ?")) bulk(false); };
  paint();
  const mesUid = new Set(el.map(e => e.uid));
  const a = onSnapshot(query(collection(db, "deblocages"), where("doc", "==", d.corrige.id)), snap => {
    on = new Set(); snap.forEach(x => { const u = x.data().uid; if (mesUid.has(u)) on.add(u); }); paint();
  }, e => toast("Lecture impossible : " + e.code));
  /* Point de cours lié (22/11/2026) : état affiché sous le nom de l'élève, plus d'onglet à part */
  const b = (d.avecPdc || (d.corrige && !d.test && !d.chapitre)) ? onSnapshot(collection(db, "pointsdecours"), snap => {
    P = {}; CP = {};
    snap.forEach(x => { const v = x.data(); if (!mesUid.has(v.uid)) return;
      if (d.avecPdc && v.pdc === d.pdc) P[v.uid] = v;
      if (v.type === "pouce" && v.pdc === "pouce:" + d.corrige.id) CP[v.uid] = v; });   // coups de pouce en cascade (24/11/2026)
    paint();
  }, () => {}) : () => {};
  unsub = () => { a(); b(); };
}

/* == Évaluations == */
const fmtDate = d => d ? d.split("-").reverse().join("/") : "";
function evalsDe(cid){ return (EVAL.evaluations || []).filter(e => e.classe === cid).sort((a, b) => (b.date || "").localeCompare(a.date || "")); }
async function voirPdf(item, titre){
  const w = window.open("", "_blank");
  try {
    if (!MAITRE) throw new Error("cles");
    const k = await crypto.subtle.importKey("raw", b64(await unwrap(item)), "AES-GCM", false, ["decrypt"]);
    const r = await fetch(BASE + "docs/evaluations/" + item.fichier, {cache:"no-cache"}); if (!r.ok) throw new Error("x");
    const buf = new Uint8Array(await r.arrayBuffer());
    const url = URL.createObjectURL(new Blob([await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, k, buf.slice(12))], {type:"application/pdf"}));
    if (w) w.location.href = url; else location.href = url;
  } catch(e){ if (w) w.close(); toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Ouverture impossible."); }
}
function paneEvals(c){
  const evs = evalsDe(c.id), el = elevesDe(c);
  if (!evs.length) { $("#pane").innerHTML = `<p class="empty">Aucune évaluation corrigée pour cette classe.</p>`; return; }
  const ids = new Set(evs.flatMap(e => e.copies.map(x => x.corrige.id))), mesUid = new Set(el.map(e => e.uid));
  const render = counts => {
    $("#pane").innerHTML = `<div class="card">` + evs.map((e, i) => {
      const n = e.copies.reduce((a, x) => a + (counts[x.corrige.id] || 0), 0), t = e.copies.length;
      return `<button class="row" data-i="${i}"><span class="main"><span class="t">${esc((e.date ? fmtDate(e.date) + " – " : "") + e.titre)}</span><span class="m">${n === t ? "Publiée pour toute la classe" : n ? n + " copie" + (n>1?"s":"") + " publiée" + (n>1?"s":"") : "Pas encore publiée"}</span></span><span class="count${n===t?" full":""}">${n}/${t}</span><span class="chev"></span></button>`;
    }).join("") + `</div><p class="note">Chaque élève ne voit que sa propre copie, dans « Mes évaluations », une fois publiée.</p>`;
    $("#pane").querySelectorAll(".row").forEach(b => b.onclick = () => go(evalEleves, c.id, evs[+b.dataset.i]));
  };
  render({});
  unsub = onSnapshot(collection(db, "deblocages"), snap => {
    const counts = {}; snap.forEach(x => { const v = x.data(); if (ids.has(v.doc) && mesUid.has(v.uid)) counts[v.doc] = (counts[v.doc] || 0) + 1; }); render(counts);
  }, e => toast("Lecture impossible : " + e.code));
}
function evalEleves(cid, ev){
  const c = CLASSES.find(x => x.id === cid);
  setBar((ev.date ? fmtDate(ev.date) + " – " : "") + ev.titre, c.nom, true);
  const el = elevesDe(c).slice().sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  const cp = Object.fromEntries(ev.copies.map(x => [x.login, x]));
  const avec = el.filter(e => cp[e.login]);
  let on = new Set();
  $("#app").innerHTML = `<div class="progress" aria-hidden="true"><i id="pb"></i></div><p class="note" id="pn"></p>
    <div class="btns"><button class="btn ok" id="all">Publier pour toute la classe</button><button class="btn ghost" id="none">Tout retirer</button>${ev.bilan ? `<button class="btn ghost" id="bil">Voir le bilan de correction</button>` : ""}</div>
    <div class="card" id="list">${el.map(e => cp[e.login]
      ? `<div class="row" style="cursor:default"><span class="main"><span class="t">${esc(e.nom)}</span><span class="m" data-m="${esc(e.uid)}">Non publiée</span></span>
         <button class="btn ghost" style="width:auto;margin:0 8px;padding:6px 10px" data-voir="${esc(e.login)}">Voir</button>
         <label class="sw"><input type="checkbox" data-uid="${esc(e.uid)}" data-login="${esc(e.login)}" aria-label="Publier pour ${esc(e.nom)}"><span></span></label></div>`
      : `<div class="row" style="cursor:default"><span class="main"><span class="t">${esc(e.nom)}</span><span class="m">Pas de copie</span></span></div>`).join("")}</div>`;
  const boxes = [...$("#list").querySelectorAll("input")];
  const paint = () => {
    boxes.forEach(b => { b.checked = on.has(b.dataset.uid); $(`[data-m="${b.dataset.uid}"]`).textContent = b.checked ? "Publiée : l'élève voit sa copie" : "Non publiée"; });
    $("#pb").style.width = (100 * on.size / Math.max(1, avec.length)) + "%";
    $("#pn").textContent = `${on.size} / ${avec.length} copies publiées.`;
  };
  const ref = (uid, login) => doc(db, "deblocages", cp[login].corrige.id + "_" + uid);
  const data = async (uid, login) => ({ uid, doc: cp[login].corrige.id, classe: cid, cle: await unwrap(cp[login]), at: serverTimestamp() });
  boxes.forEach(b => b.onchange = async () => {
    const uid = b.dataset.uid, login = b.dataset.login, val = b.checked; b.disabled = true;
    try { if (!MAITRE) throw new Error("cles"); if (val) { await setDoc(ref(uid, login), await data(uid, login)); on.add(uid); } else { await deleteDoc(ref(uid, login)); on.delete(uid); } }
    catch(e){ b.checked = !val; toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
    b.disabled = false; paint();
  });
  $("#list").querySelectorAll("[data-voir]").forEach(b => b.onclick = () => voirPdf(cp[b.dataset.voir], b.dataset.voir));
  if (ev.bilan) $("#bil").onclick = () => voirPdf(ev.bilan, "bilan");
  const bulk = async val => {
    try {
      if (!MAITRE) throw new Error("cles");
      const batch = writeBatch(db);
      for (const e of avec) { if (val) batch.set(ref(e.uid, e.login), await data(e.uid, e.login)); else batch.delete(ref(e.uid, e.login)); }
      await batch.commit(); toast(val ? "Copies publiées : chaque élève voit la sienne." : "Copies retirées.");
    } catch(e){ toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
  };
  $("#all").onclick = () => bulk(true);
  $("#none").onclick = () => { if (confirm("Retirer cette évaluation pour toute la classe ?")) bulk(false); };
  paint();
  const ids = new Set(ev.copies.map(x => x.corrige.id)), mesUid = new Set(avec.map(e => e.uid));
  unsub = onSnapshot(collection(db, "deblocages"), snap => {
    on = new Set(); snap.forEach(x => { const v = x.data(); if (ids.has(v.doc) && mesUid.has(v.uid)) on.add(v.uid); }); paint();
  }, e => toast("Lecture impossible : " + e.code));
}

    <p class="note">Les identifiants sont à distribuer une seule fois. Si un élève oublie son mot de passe, il est affiché ici.</p>`;

async function createAccounts(c){
  const btn = $("#mk"); btn.disabled = true;
  const app2 = initializeApp(FB, "creation-" + Date.now()), a2 = getAuth(app2);
  let done = 0, fail = 0;
  for (const e of c.eleves) {
    if (e.uid) continue;
    btn.textContent = `Création… ${done + fail + 1}`;
    const email = e.login + DOMAINE;
    try {
      let cred;
      try { cred = await createUserWithEmailAndPassword(a2, email, e.mdp); }
      catch(x){ if (x.code === "auth/email-already-in-use") cred = await signInWithEmailAndPassword(a2, email, e.mdp); else throw x; }
      const uid = cred.user.uid; await signOut(a2);
      await setDoc(doc(db, "eleves", uid), { nom:e.nom, classe:c.id, site:c.site, login:e.login, ...(e.premium ? { premium:true } : {}) });
      e.uid = uid; done++;
      await setDoc(doc(db, "classes", c.id), { eleves:c.eleves }, { merge:true });
    } catch(x) { fail++; console.warn(e.login, x.code); }
    await new Promise(r => setTimeout(r, 400));
  }
  toast(fail ? `${done} comptes créés, ${fail} en échec (réessayez plus tard).` : `${done} comptes créés.`);
  classe(c.id, "eleves");
}

}


/* ---------- Points de cours en ligne (22/11/2026) ----------
   L'élève construit le point de cours de fin d'activité sur le site (débloqué avec le corrigé de l'activité).
   Firestore « pointsdecours/<uid>__<id> » : etape, total, erreurs, termine. Suivi en direct, élève par élève. */
function pdcsDe(site){
  const c = CAT.classes.find(x => x.id === site); if (!c) return [];
  return c.chapitres.map(ch => ({ ch, docs: ch.docs.filter(d => d.type === "Point de cours") })).filter(x => x.docs.length);
}
function panePdc(c){
  const groupes = pdcsDe(c.site), el = elevesDe(c), mesUid = new Set(el.map(e => e.uid));
  let P = null, D = null;
  const render = () => {
    if (!P || !D) return;
    $("#pane").innerHTML = groupes.slice().reverse().map(g => {
      const cartes = g.docs.map(d => {
        let nf = 0, nc = 0;
        const rows = el.map(e => {
          const v = P[e.uid + "__" + d.pdc], ouvert = D.has(d.corrige.id + "_" + e.uid);
          let m, cl;
          if (v && v.termine) { nf++; m = "🟢 Terminé · " + (v.erreurs ? plur(v.erreurs, "erreur") : "aucune erreur") + (jour(v.date) ? " · " + jour(v.date) : ""); cl = "st-ok"; }
          else if (v) { nc++; m = "🟠 En cours · étape " + (v.etape || 0) + "/" + (v.total || "?") + (v.erreurs ? " · " + plur(v.erreurs, "erreur") : ""); cl = "st-cours"; }
          else { m = ouvert ? "⚪ Pas commencé (débloqué)" : "🔒 Pas encore débloqué (corrigé de l'activité)"; cl = "st-non"; }
          return `<div class="row" style="cursor:default"><span class="main"><span class="t">${esc(e.nom)}</span><span class="m ${cl}">${esc(m)}</span></span></div>`;
        }).join("");
        return `<p class="sec">${esc(d.activite || d.titre)} – ${nf}/${el.length} terminé${nf > 1 ? "s" : ""}${nc ? " · " + nc + " en cours" : ""}</p><div class="card">${rows}</div>`;
      }).join("");
      return `<h2 style="margin:16px 4px 2px;font-size:1.15rem">${esc(g.ch.titre)}</h2>${cartes}`;
    }).join("") + `<p class="note">Le point de cours se débloque en même temps que le corrigé de l'activité (onglet Corrigés). L'élève le construit sur le site avec le bouton « Vérifier » ; après deux essais faux, la réponse s'affiche (comptée comme une erreur). Un élève qui a beaucoup d'erreurs a peut-être cliqué au hasard : va le voir.</p>`;
  };
  $("#pane").innerHTML = `<p class="empty">Chargement…</p>`;
  const a = onSnapshot(collection(db, "pointsdecours"), snap => { P = {}; snap.forEach(x => { const v = x.data(); if (mesUid.has(v.uid)) P[v.uid + "__" + v.pdc] = v; }); render(); },
    e => { $("#pane").innerHTML = `<p class="empty">Lecture impossible (${esc(e.code)}).</p>`; });
  const b = onSnapshot(collection(db, "deblocages"), snap => { D = new Set(); snap.forEach(x => D.add(x.id)); render(); }, () => { D = new Set(); render(); });
  unsub = () => { a(); b(); };
}

/* ---------- Tests d'entrée et fiches de révision ---------- */
const testsDe = site => (REV.tests || []).filter(t => t.site === site);
/* Écoute en direct des tests faits et des fiches terminées (tous les élèves) */
function suivreTests(cb){
  let T = null, F = null;
  const go2 = () => { if (T && F) cb(etatTests(T, F)); };
  const a = onSnapshot(collection(db, "tests"), snap => { T = []; snap.forEach(x => T.push({ id: x.id, ...x.data() })); go2(); }, e => toast("Lecture des tests impossible : " + e.code));
  const b = onSnapshot(collection(db, "revisions"), snap => { F = []; snap.forEach(x => F.push(x.data())); go2(); }, () => {});
  unsub = () => { a(); b(); };
}
function etatTests(T, F){
  const faites = {}; F.forEach(f => { faites[f.uid + "__" + f.test + "__" + f.fiche] = f; });
  return T.map(t => {
    const fiches = (t.aRevoir || []).map(f => ({ id: f, fait: faites[t.uid + "__" + t.test + "__" + f] || null }));
    return { ...t, fiches, pret: fiches.every(x => x.fait) };
  });
}
const titreTest = id => ((REV.tests || []).find(t => t.id === id) || {}).chapitre || id;
const titreFiche = id => (REV.fiches[id] || {}).titre || id;
const jour = ts => { try { return ts && ts.toDate ? ts.toDate().toLocaleDateString("fr-FR") : ""; } catch(_) { return ""; } };
function afficherNotif(etat){
  const box = $("#notif"); if (!box) return;
  const nv = etat.filter(t => t.pret && !t.vuProf);
  if (!nv.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="notif"><h2>🔔 Prêts à commencer le chapitre</h2>` + nv.map(t =>
    `<div class="it"><span><b>${esc(t.nom)}</b> – ${esc(titreTest(t.test))}<small>${t.fiches.length ? "Test fait, " + plur(t.fiches.length, "fiche") + " de révision " + (t.fiches.length > 1 ? "terminées" : "terminée") : "Test fait, aucune fiche à revoir"}</small></span><button class="mini" data-id="${esc(t.id)}">Vu</button></div>`).join("")
    + (nv.length > 1 ? `<div style="text-align:right;margin-top:6px"><button class="mini" id="tousvus">Tout marquer comme vu</button></div>` : "") + `</div>`;
  const vu = ids => Promise.all(ids.map(id => setDoc(doc(db, "tests", id), { vuProf: true }, { merge: true }))).catch(e => toast("Impossible : " + e.code));
  box.querySelectorAll("[data-id]").forEach(b => b.onclick = () => vu([b.dataset.id]));
  const t = box.querySelector("#tousvus"); if (t) t.onclick = () => vu(nv.map(x => x.id));

/* Onglet Tests (24/11/2026) : seulement les tests du niveau de la classe (1re / 2e année),
   en tableau : élèves en lignes, un test (= un chapitre) par colonne, cadenas comme pour les corrigés. */
const anDeClasse = c => { const m = /(\d)\s*(?:re|ère|e|ème)\s+ann[ée]e/i.exec(c.nom || ""); return m ? +m[1] : null; };
const anDuTest = t => { const k = (CAT && CAT.classes || []).find(x => x.id === t.site); if (!k || !t.verrou) return null;
  const ch = k.chapitres.find(h => h.verrou && h.verrou.id === t.verrou.chap); return ch && ch.annee ? ch.annee : null; };
const testsClasse = c => { const a = anDeClasse(c); return testsDe(c.site).filter(t => { const b = anDuTest(t); return !a || !b || a === b; }); };
function paneTests(c){
  const tests = testsClasse(c), el = elevesDe(c), mesUid = new Set(el.map(e => e.uid));
  if (!tests.length) { $("#pane").innerHTML = `<p class="empty">Aucun test d'entrée pour cette classe.</p>`; return; }
  if (!el.length) { $("#pane").innerHTML = `<p class="empty">Créez d'abord les comptes des élèves (onglet « Élèves et comptes »).</p>`; return; }
  let etat = [], D = new Set(), busy = new Set(); const cles = {};
  const lockDe = t => t.verrou ? { titre: t.titre, test: true, chapitre: true, corrige: t.verrou } : null;
  const key = async t => { if (!cles[t.id]) { if (!MAITRE) throw new Error("cles"); cles[t.id] = await unwrap(lockDe(t)); } return cles[t.id]; };
  const ref = (t, uid) => doc(db, "deblocages", t.verrou.id + "_" + uid);
  const ouvert = (t, uid) => !t.verrou || D.has(t.verrou.id + "_" + uid);
  const court = t => { const s = t.chapitre || t.titre || ""; return s.length > 18 ? s.slice(0, 16) + "…" : s; };
  const caseDe = (t, uid) => {
    const r = etat.find(x => x.uid === uid && x.test === t.id);
    if (r) { const nf = r.fiches.filter(x => x.fait).length;
      return `<span class="dot ${r.pret ? "fini" : "cours"}" title="${r.pret ? "Prêt pour le chapitre" : "Fiches de révision en cours"}"></span><small class="tsc">${esc(r.score + "/" + r.sur)}${r.fiches.length ? " · fiches " + nf + "/" + r.fiches.length : ""}</small>`; }
    return ouvert(t, uid) ? `<span class="dot non" title="Test ouvert, pas encore fait"></span>` : "🔒";
  };
  const render = () => {
    const sx = $(".grille") ? $(".grille").scrollLeft : 0;
    const tot = t => { const fait = etat.filter(x => x.test === t.id && mesUid.has(x.uid)), prets = fait.filter(x => x.pret).length;
      const ouv = el.filter(e => ouvert(t, e.uid)).length;
      return `${t.verrou ? "🔓 " + ouv + "/" + el.length + "<br>" : ""}faits ${fait.length}/${el.length}<br>prêts ${prets}/${el.length}`; };
    $("#pane").innerHTML = `<div class="card grille"><table><tr><th class="nom">Élève</th>${tests.map((t, j) => `<th class="col tcol" data-j="${j}" title="${esc(t.titre)}">${esc(court(t))}</th>`).join("")}</tr>`
      + el.map(e => `<tr><td class="nom">${esc(e.nom)}</td>${tests.map((t, j) => `<td class="c${busy.has(t.id + "_" + e.uid) ? " busy" : ""}" data-j="${j}" data-uid="${esc(e.uid)}">${caseDe(t, e.uid)}</td>`).join("")}</tr>`).join("")
      + `<tr class="tot"><td class="nom">Classe</td>${tests.map(t => `<td>${tot(t)}</td>`).join("")}</tr></table></div>`
      + `<p class="note">🔒 test fermé : touche la case pour l'ouvrir à l'élève (touche-la à nouveau pour le refermer tant qu'il ne l'a pas fait). Touche le titre d'une colonne pour toute la classe. Une fois le test fait, touche la case pour voir ses réponses.<br><span class="dot non"></span> ouvert, pas encore fait · <span class="dot cours"></span> fait, fiches de révision en cours · <span class="dot fini"></span> prêt pour le chapitre</p>`
      + `<p class="note">Le test et les fiches se font sur le site, onglet « Mes révisions ». Les fiches des compétences ratées s'ouvrent toutes seules pour l'élève. Une fiche n'est « terminée » que lorsque ses trois questions sont réussies.</p>`;
    if ($(".grille")) $(".grille").scrollLeft = sx;
    $("#pane").querySelectorAll("td.c").forEach(td => td.onclick = async () => {
      const t = tests[+td.dataset.j], uid = td.dataset.uid, id = t.id + "_" + uid;
      if (etat.some(x => x.uid === uid && x.test === t.id)) return go(testEleve, c.id, t.id, uid);
      if (!t.verrou || busy.has(id)) return;
      const val = !D.has(t.verrou.id + "_" + uid); busy.add(id); render();
      try { if (val) await setDoc(ref(t, uid), { uid, doc:t.verrou.id, classe:c.id, cle: await key(t), at: serverTimestamp() }); else await deleteDoc(ref(t, uid)); }
      catch(e){ toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
      busy.delete(id); render();
    });
    $("#pane").querySelectorAll("th.tcol").forEach(th => th.onclick = async () => {
      const t = tests[+th.dataset.j]; if (!t.verrou) return toast("Ce test n'a pas de cadenas.");
      const tous = el.every(e => ouvert(t, e.uid));
      if (!confirm((tous ? "Refermer le test « " : "Ouvrir le test « ") + t.chapitre + " » pour toute la classe ?")) return;
      try { const k = tous ? null : await key(t), batch = writeBatch(db);
        el.forEach(e => { if (tous) batch.delete(ref(t, e.uid)); else batch.set(ref(t, e.uid), { uid:e.uid, doc:t.verrou.id, classe:c.id, cle:k, at:serverTimestamp() }); });
        await batch.commit(); toast(tous ? "Test d'entrée refermé pour toute la classe." : "Test d'entrée ouvert à toute la classe."); }
      catch(e){ toast(e.message === "cles" ? "Clés absentes : importez le fichier dans Réglages." : "Échec, vérifiez la connexion."); }
    });
  };
  $("#pane").innerHTML = `<p class="empty">Chargement…</p>`;
  suivreTests(x => { etat = x; render(); });
  const u1 = unsub;
  const u2 = onSnapshot(collection(db, "deblocages"), snap => {
    D = new Set(); snap.forEach(x => { const v = x.data(); if (mesUid.has(v.uid)) D.add(v.doc + "_" + v.uid); }); render();
  }, e => toast("Lecture impossible : " + e.code));
  unsub = () => { u1(); u2(); };
}

let CACHE_TESTS = {};
async function cleOutils(){
  if (KOUT) return KOUT;
  for (const id in SITES) {
    const wk = CAT.outilsWk && CAT.outilsWk[id]; if (!wk) continue;
    try {
      const k = await crypto.subtle.importKey("raw", b64(SITES[id]), "AES-GCM", false, ["decrypt"]);
      const w = b64(wk);
      KOUT = await crypto.subtle.importKey("raw", await crypto.subtle.decrypt({name:"AES-GCM", iv:w.slice(0,12), additionalData:enc.encode("outils")}, k, w.slice(12)), "AES-GCM", false, ["decrypt"]);
      return KOUT;
    } catch(_){}
  }
  return null;
}
async function contenuTest(t){
  if (CACHE_TESTS[t.id]) return CACHE_TESTS[t.id];
  let k;
  if (t.verrou) {   // test sous son propre cadenas : clé du test enveloppée par la clé maître
    if (!MAITRE) return null;
    const w = b64(t.verrou.wk);
    k = await crypto.subtle.importKey("raw", await crypto.subtle.decrypt({name:"AES-GCM", iv:w.slice(0,12), additionalData:enc.encode(t.verrou.id)}, MAITRE, w.slice(12)), "AES-GCM", false, ["decrypt"]);
  } else k = await cleOutils();
  if (!k) return null;
  const buf = new Uint8Array(await (await fetch(BASE + "docs/revisions/" + t.fichier, {cache:"no-cache"})).arrayBuffer());
  return CACHE_TESTS[t.id] = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, k, buf.slice(12))));
}
const sansLatex = s => String(s || "").replace(/\$([^$]*)\$/g, (m, x) => x.replace(/\\text\{([^}]*)\}/g, "$1").replace(/\\Omega/g, "Ω").replace(/\\log/g, "log").replace(/\\ /g, " ").replace(/\{,\}/g, ",").replace(/_(\w)/g, "$1").replace(/[{}\\]/g, ""));

function testEleve(cid, tid, uid){
  const c = CLASSES.find(x => x.id === cid), t = (REV.tests || []).find(x => x.id === tid), e = elevesDe(c).find(x => x.uid === uid);
  setBar(e.nom, "Test d'entrée – " + t.chapitre, true);
  $("#app").innerHTML = `<p class="empty">Chargement…</p>`;
  let T = null; contenuTest(t).then(x => { T = x; }).catch(() => {});
  suivreTests(async etat => {
    const r = etat.find(x => x.uid === uid && x.test === tid);
    if (!r) { $("#app").innerHTML = `<p class="empty">Le test a été effacé.</p>`; return; }
    try { T = T || await contenuTest(t); } catch(_){}
    const qs = (r.justes || []).map((ok, i) => {
      const q = T && T.questions[i];
      return `<div class="qrow"><span class="r ${ok ? "ok" : "ko"}">${ok ? "✓" : "✗"}</span><span class="x">Question ${i + 1}${q ? " – " + esc(titreFiche(q.fiche)) : ""}<small>${q ? esc(sansLatex(q.enonce)) + "<br>" : ""}Réponse : ${esc((r.reponses || [])[i] || "(vide)")}${q ? " " + esc(q.unite || "") + (ok ? "" : " · attendu " + esc(String(q.reponse).replace(".", ",")) + " " + esc(q.unite || "")) : ""}</small></span></div>`;
    }).join("");
    const fs = r.fiches.map(f => `<div class="qrow"><span class="r ${f.fait ? "ok" : "ko"}">${f.fait ? "✓" : "…"}</span><span class="x">${esc(titreFiche(f.id))}<small>${f.fait ? "Terminée le " + jour(f.fait.date) + " · " + (f.fait.erreurs ? plur(f.fait.erreurs, "réponse fausse") + " avant de réussir" : "réussie du premier coup") : "Pas encore terminée"}</small></span></div>`).join("");
    $("#app").innerHTML = `<p class="note" style="margin:14px 4px 6px">Fait le ${jour(r.date)} · <b>${r.score}/${r.sur}</b> · ${r.pret ? '<span class="st-ok">✅ Prêt pour le chapitre</span>' : '<span class="st-cours">Fiches en cours</span>'}</p>
      <h2 style="margin:14px 4px 6px;font-size:1.1rem">Fiches de révision ouvertes</h2><div class="card">${fs || '<div class="qrow"><span class="x">Aucune : toutes les compétences sont acquises.</span></div>'}</div>
      <h2 style="margin:14px 4px 6px;font-size:1.1rem">Réponses au test</h2><div class="card">${qs}</div>
      <div class="btns"><button class="btn ghost" id="redo">Faire refaire le test</button></div>`;
    $("#redo").onclick = async () => {
      if (!confirm("Effacer le test de " + e.nom + " et ses fiches terminées ? Il pourra refaire le test.")) return;
      try {
        await Promise.all(r.fiches.filter(f => f.fait).map(f => deleteDoc(doc(db, "revisions", uid + "__" + tid + "__" + f.id))));
        await deleteDoc(doc(db, "tests", r.id)); toast("Test effacé."); $("#back").click();
      } catch(x){ toast("Impossible : " + x.code); }
    };
  });
}

/* ---------- Réglages : import du fichier ---------- */
function settings(){
  setBar("Réglages", "", true);
  $("#app").innerHTML = `<p class="sec">Clés et listes de classes</p>
    <div class="card" style="padding:16px">
      <p style="margin-top:0">Importez « Fichier pour l'appli professeur.json » (dossier « Site - contenu » du Mac). À refaire seulement si les listes de classes changent.</p>
      <input type="file" id="f" accept=".json,application/json" hidden>
      <button class="btn" id="pick">Choisir le fichier…</button><p class="err" id="err"></p></div>
    <p class="sec">Compte</p>
    <div class="card"><button class="row" id="out"><span class="main"><span class="t">Se déconnecter</span></span></button></div>`;
  $("#pick").onclick = () => $("#f").click();
  $("#f").onchange = async () => {
    const file = $("#f").files[0]; if (!file) return;
    const err = $("#err"); err.textContent = "";
    try {
      const j = JSON.parse(await file.text());
      if (j.format !== "appli-prof-1") throw new Error("Ce n'est pas le bon fichier.");
      const batch = writeBatch(db);
      batch.set(doc(db, "prive", "cles"), { sites:j.cles, corriges:j.corriges });
      for (const s in j.cles) batch.set(doc(db, "clesSite", s), { cle:j.cles[s] });
      const old = {}; CLASSES.forEach(c => (c.eleves || []).forEach(e => { if (e.uid) old[e.login] = e.uid; }));
      j.classes.forEach((c, i) => batch.set(doc(db, "classes", c.id), { nom:c.nom, site:c.site, ordre:i,
        eleves:c.eleves.map(e => ({ nom:e.nom, login:e.login, mdp:e.mdp, ...(e.premium ? { premium:true } : {}), ...(old[e.login] ? { uid:old[e.login] } : {}) })) }));
      await batch.commit();
      await loadAll(); toast("Import réussi."); home();
    } catch(x){ err.textContent = x.message && !x.code ? x.message : "Import impossible (" + (x.code || "erreur") + ")."; }
  };
  $("#out").onclick = async () => { await signOut(auth); };
}

onAuthStateChanged(auth, async user => {
  stopLive();
  if (!user) return loginScreen();
  if (user.email !== PROF) { await signOut(auth); return loginScreen(); }
  try { await loadAll(); home(); }
  catch(e){ $("#app").innerHTML = `<p class="empty">Chargement impossible (${esc(e.code || e.message)}). Vérifiez la connexion puis rechargez.</p>`; setBar("Corrigés", "", false); }
});

<script>
/* Remplace les émojis 🔒/🔓 par des cadenas dessinés bien distincts (24/11/2026) */
(function(){
  const F='<svg class="lk" viewBox="0 0 24 24" aria-label="verrouillé"><path d="M7 11V7.5a5 5 0 0 1 10 0V11" fill="none" stroke="#B42318" stroke-width="2.6" stroke-linecap="round"/><rect x="4" y="10.5" width="16" height="12" rx="2.5" fill="#B42318"/><circle cx="12" cy="15.6" r="1.7" fill="#fff"/><rect x="11.1" y="16" width="1.8" height="3.6" rx=".9" fill="#fff"/></svg>';
  const O='<svg class="lk" viewBox="0 0 24 24" aria-label="ouvert"><path d="M17 11V6.5a5 5 0 0 0-9.6-2" fill="none" stroke="#2E7D32" stroke-width="2.6" stroke-linecap="round" transform="rotate(-28 17 11) translate(0 -2.5)"/><rect x="4" y="10.5" width="16" height="12" rx="2.5" fill="#2E7D32"/><path d="M8.3 16.6l2.5 2.5 4.9-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const RX=/[\u{1F512}\u{1F513}]/u, SKIP=/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT|TITLE)$/;
  function fix(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>RX.test(n.nodeValue)&&n.parentNode&&!SKIP.test(n.parentNode.nodeName)?1:2});
    const L=[]; while(w.nextNode()) L.push(w.currentNode);
    L.forEach(n=>{ const sp=document.createElement("span");
      sp.innerHTML=n.nodeValue.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\u{1F512}\uFE0F?/gu,F).replace(/\u{1F513}\uFE0F?/gu,O);
      const fr=document.createDocumentFragment(); while(sp.firstChild) fr.appendChild(sp.firstChild); n.parentNode.replaceChild(fr,n); });
  }
  const go=()=>{ fix(document.body); new MutationObserver(ms=>ms.forEach(m=>{ if(m.type==="characterData"){ if(m.target.parentNode) fix(m.target.parentNode); } else m.addedNodes.forEach(a=>{ if(a.nodeType===3){ if(a.parentNode) fix(a.parentNode); } else if(a.nodeType===1) fix(a); }); })).observe(document.body,{childList:true,subtree:true,characterData:true}); };
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",go):go();
})();
</script>
